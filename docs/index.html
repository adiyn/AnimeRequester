<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./img/facicon.png">
    <script type="module" src="./js/main.js"></script>
</head>
<body>
    <div id="banner-y"></div>

    <header id="banner-x">
        <div class="header-inner">
            <h1 class="logo">ANIME REQUESTER</h1>
        </div>
    </header>

    <main id="app">
        <section id="request-container">
            <input type="checkbox" id="theme-toggle" class="theme-checkbox">

            <div class="panel-header">
                <h2>QUERY DATABASE</h2>
                <label for="theme-toggle" class="theme-toggle-btn" title="Toggle form theme">
                    <span class="toggle-dot"></span>
                    <span class="toggle-text"></span>
                </label>
            </div>

            <form id="request-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="q">TITLE / KEYWORD</label>
                        <input id="q" type="text" name="q" placeholder="ex. Fullmetal, Naruto">
                    </div>

                    <div class="input-group">
                        <label for="status">STATUS</label>
                        <input id="status" type="text" name="status" placeholder="airing, complete, upcoming">
                    </div>

                    <div class="input-group">
                        <label for="order_by">SORT BY</label>
                        <input id="order_by" type="text" name="order_by" placeholder="popularity, score, rank" value="popularity">
                    </div>

                    <div class="input-group">
                        <label for="sort">ORDER BY</label>
                        <input id="sort" type="text" name="sort" placeholder="asc or desc" value="desc">
                    </div>

                    <div class="input-group">
                        <label for="year">YEAR</label>
                        <input id="year" type="number" name="year" placeholder="ex. 2024" min="1960" max="2030">
                    </div>

                    <div class="input-group">
                        <label for="limit">MAX RESULTS</label>
                        <input id="limit" type="number" name="limit" placeholder="10" value="10" min="1" max="25">
                    </div>
                </div>

                <button type="submit" id="submit-btn">
                    <span>EXECUTE SEARCH</span>
                </button>
            </form>
        </section>

        <section id="response-container">
            <div id="response-content">
                <!-- à remplir avec du JS -->
            </div>
        </section>
    </main>

    <footer id="bigfoot-container">
        <div class="footer-inner">
            <p class="footer-left">SOURCE: TENRAI API</p>
            <p class="footer-right">made by students from the IUT of Ifs, Caen.</p>
        </div>
    </footer>
</body>
</html>
